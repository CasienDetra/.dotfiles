set -ga terminal-overrides ',xterm-kitty:RGB' 
set -g default-terminal "${TERM}"
set-option -sa terminal-overrides ",xterm*:Tc"
# set -g default-terminal "tmux-256color"
# set -g default-terminal "xterm-256color"
# set -ga terminal-overrides ",*256col*:Tc"
# set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g prefix ^B
set -g base-index 1              # Start windows at 1
set -g detach-on-destroy off     # Don't exit tmux when closing a session
set -g escape-time 0             # No delay for escape key
set -g history-limit 1000000     # Huge history
set -g renumber-windows on       # Gapless window numbers
set -g set-clipboard on          # Use system clipboard
set -g status-position top
set -g status-style bg=default
set -g pane-base-index 1
set -g allow-passthrough on
set -ga update-environment TERM_PROGRAM
#some keybinds

#lazygit
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E 'lazygit'

unbind r
bind r source-file ~/.config/tmux/tmux.conf
unbind v
bind v copy-mode

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R


bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# Renumber windows after closing
# inactive window
set-window-option -g window-status-style fg=colour245,bg=default

# active window
set-window-option -g window-status-current-style fg=colour111,bg=colour235,bright

# pane borders
set-option -g pane-border-style fg=colour238
set-option -g pane-active-border-style fg=colour111

# message text
set-option -g message-style bg=colour111,fg=colour235

# pane number display
set-option -g display-panes-active-colour colour204
set-option -g display-panes-colour colour149

# clock
set-window-option -g clock-mode-colour colour141
set -g status-justify "left"
set -g @rose_pine_variant 'main' # Options are 'main', 'moon' or 'dawn'
# plugin 
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'vaaleyard/tmux-dotbar'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# formatting
set -g @tmux-dotbar-right true
set -g @tmux-dotbar-ssh-enabled true
set -g @tmux-dotbar-ssh-icon '󰌘'
set -g @tmux-dotbar-window-status-format " #W "
set -g @tmux-dotbar-window-status-current-format " #W "
set -g @tmux-dotbar-window-status-separator "|"
set -g @tmux-dotbar-bg "default"
set -g @tmux-dotbar-position "top"
set -g @tmux-dotbar-fg "#585b70"
set -g @tmux-dotbar-fg-current "#cdd6f4"
set -g @tmux-dotbar-fg-session "#a399b2"
set -g @tmux-dotbar-fg-prefix "#89B4FA"
#some stuff icons
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   
set -g status-position bottom 
set -g status-right-length 100
set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

run '~/.tmux/plugins/tpm/tpm'
