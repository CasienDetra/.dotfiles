customCommands:
  - key: "C"
    command: "git cz"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal

gui:
  theme:
    activeBorderColor:
      - "#fabd2f" # Gruvbox Yellow
      - bold

    inactiveBorderColor:
      - "#665c54" # Gray

    searchingActiveBorderColor:
      - "#8ec07c" # Aqua
      - bold

    optionsTextColor:
      - "#8ec07c" # Aqua

    selectedLineBgColor:
      - "#3c3836" # Dark Gray

    inactiveViewSelectedLineBgColor:
      - "#282828" # Background

    cherryPickedCommitBgColor:
      - "#b8bb26" # Green
    cherryPickedCommitFgColor:
      - "#282828"

    markedBaseCommitBgColor:
      - "#fabd2f" # Yellow
    markedBaseCommitFgColor:
      - "#282828"

    unstagedChangesColor:
      - "#fb4934" # Bright Red

    defaultFgColor:
      - "#ebdbb2" # Foreground

authorColors:
  "*": "#83a598" # Blue

branchColors:
  main: "#b8bb26"    # Green
  master: "#b8bb26"  # Green
